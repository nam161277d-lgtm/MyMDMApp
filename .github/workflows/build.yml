name: Build Binlite VIP Pro Architecture

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v4

    - name: Khởi tạo Kiến trúc Module Binlite (VIP Pro - Có Fake Cam)
      run: |
        mkdir -p app/src/main/java/com/binlite/mdm/core
        mkdir -p app/src/main/java/com/binlite/mdm/services
        mkdir -p app/src/main/java/com/binlite/mdm/utils
        mkdir -p app/src/main/res/xml
        mkdir -p app/src/main/res/layout
        mkdir -p app/src/main/res/values

        # 1. Cấu hình Gradle
        cat << 'EOF' > settings.gradle
        pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
        dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
        rootProject.name = "BinliteMDM"
        include ':app'
        EOF

        cat << 'EOF' > build.gradle
        plugins { id 'com.android.application' version '8.1.0' apply false; id 'org.jetbrains.kotlin.android' version '1.9.0' apply false }
        EOF

        cat << 'EOF' > app/build.gradle
        plugins { id 'com.android.application'; id 'org.jetbrains.kotlin.android' }
        android {
            namespace 'com.binlite.mdm'
            compileSdk 34
            defaultConfig {
                applicationId "com.binlite.mdm"
                minSdk 26
                targetSdk 34
                versionCode 3
                versionName "3.0 Pro Max"
            }
            compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
            kotlinOptions { jvmTarget = '17' }
        }
        dependencies {
            implementation 'androidx.core:core-ktx:1.12.0'
            implementation 'androidx.appcompat:appcompat:1.6.1'
            implementation 'com.google.android.material:material:1.11.0'
            implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
        }
        EOF

        # 2. AndroidManifest.xml (Thêm quyền Camera)
        cat << 'EOF' > app/src/main/AndroidManifest.xml
        <?xml version="1.0" encoding="utf-8"?>
        <manifest xmlns:android="http://schemas.android.com/apk/res/android"
            xmlns:tools="http://schemas.android.com/tools">
            <uses-permission android:name="android.permission.INTERNET" />
            <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
            <uses-permission android:name="android.permission.READ_CONTACTS" />
            <uses-permission android:name="android.permission.WRITE_CONTACTS" />
            <uses-permission android:name="android.permission.ACCESS_MOCK_LOCATION" />
            <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />
            <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />
            <uses-permission android:name="android.permission.CAMERA" />

            <application
                android:allowBackup="true"
                android:label="Binlite Pro"
                android:theme="@style/Theme.AppCompat.Light.NoActionBar">
                
                <activity android:name=".MainActivity" android:exported="true">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN" />
                        <category android:name="android.intent.category.LAUNCHER" />
                    </intent-filter>
                </activity>

                <receiver android:name=".core.MyDeviceAdminReceiver"
                    android:permission="android.permission.BIND_DEVICE_ADMIN" android:exported="true">
                    <meta-data android:name="android.app.device_admin" android:resource="@xml/device_admin" />
                    <intent-filter>
                        <action android:name="android.app.action.DEVICE_ADMIN_ENABLED" />
                        <action android:name="android.app.action.PROFILE_PROVISIONING_COMPLETE" />
                    </intent-filter>
                </receiver>

                <service android:name=".services.AutomationService"
                    android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE" android:exported="true">
                    <intent-filter><action android:name="android.accessibilityservice.AccessibilityService" /></intent-filter>
                    <meta-data android:name="android.accessibilityservice" android:resource="@xml/accessibility_config" />
                </service>

                <service android:name=".services.AnonymousVpnService"
                    android:permission="android.permission.BIND_VPN_SERVICE" android:exported="false">
                    <intent-filter><action android:name="android.net.VpnService" /></intent-filter>
                </service>
            </application>
        </manifest>
        EOF

        # 3. Các file XML cấu hình
        cat << 'EOF' > app/src/main/res/xml/device_admin.xml
        <?xml version="1.0" encoding="utf-8"?>
        <device-admin xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-policies><force-lock /><limit-password /><wipe-data /></uses-policies>
        </device-admin>
        EOF

        cat << 'EOF' > app/src/main/res/xml/accessibility_config.xml
        <?xml version="1.0" encoding="utf-8"?>
        <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
            android:accessibilityEventTypes="typeWindowStateChanged|typeWindowContentChanged|typeViewClicked"
            android:accessibilityFeedbackType="feedbackGeneric"
            android:accessibilityFlags="flagDefault|flagRetrieveInteractiveWindows|flagIncludeNotImportantViews"
            android:canRetrieveWindowContent="true"
            android:canPerformGestures="true"
            android:description="@string/accessibility_desc" />
        EOF

        cat << 'EOF' > app/src/main/res/values/strings.xml
        <resources>
            <string name="accessibility_desc">Binlite Core - Engine tự động hóa</string>
        </resources>
        EOF

        # 4. Giao diện UI Đẳng cấp (activity_main.xml)
        cat << 'EOF' > app/src/main/res/layout/activity_main.xml
        <?xml version="1.0" encoding="utf-8"?>
        <ScrollView xmlns:android="http://schemas.android.com/apk/res/android"
            android:layout_width="match_parent" android:layout_height="match_parent" android:background="#0A0A0A">
            <LinearLayout android:layout_width="match_parent" android:layout_height="wrap_content"
                android:orientation="vertical" android:padding="20dp" android:gravity="center_horizontal">
                
                <TextView android:layout_width="wrap_content" android:layout_height="wrap_content"
                    android:text="🛡️ BINLITE COMMAND CENTER" android:textColor="#00FF9D" android:textSize="22sp" android:textStyle="bold" android:layout_marginTop="20dp" />
                <TextView android:layout_width="wrap_content" android:layout_height="wrap_content"
                    android:text="System Architecture v3.0 Pro Max" android:textColor="#666666" android:textSize="12sp" android:layout_marginBottom="30dp" />

                <!-- Khối Trạng Thái MDM -->
                <LinearLayout android:layout_width="match_parent" android:layout_height="wrap_content" android:orientation="vertical" android:background="#151515" android:padding="16dp" android:layout_marginBottom="16dp">
                    <TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="[ MDM PRIVILEGES ]" android:textColor="#555555" android:textSize="10sp" android:textStyle="bold"/>
                    <TextView android:id="@+id/tvMdmStatus" android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="Đang quét hệ thống..." android:textColor="#FFFFFF" android:textSize="14sp" android:layout_marginTop="8dp"/>
                </LinearLayout>

                <!-- Khối Mạng & Uptime -->
                <LinearLayout android:layout_width="match_parent" android:layout_height="wrap_content" android:orientation="vertical" android:background="#151515" android:padding="16dp" android:layout_marginBottom="24dp">
                    <TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="[ NETWORK &amp; SPOOFING ]" android:textColor="#555555" android:textSize="10sp" android:textStyle="bold"/>
                    <TextView android:id="@+id/tvIpStatus" android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="IP: Chưa kiểm tra" android:textColor="#FFFFFF" android:textSize="14sp" android:layout_marginTop="8dp"/>
                    <TextView android:id="@+id/tvUptime" android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="Uptime: 0h 0m" android:textColor="#AAAAAA" android:textSize="12sp" android:layout_marginTop="4dp"/>
                </LinearLayout>

                <!-- Các Nút Chức Năng Cốt Lõi -->
                <Button android:id="@+id/btnCheckIp" android:layout_width="match_parent" android:layout_height="56dp" android:text="Kiểm tra IP &amp; Proxy ngầm" android:backgroundTint="#212121" android:textColor="#00FF9D" android:layout_marginBottom="8dp"/>
                <Button android:id="@+id/btnAutoContact" android:layout_width="match_parent" android:layout_height="56dp" android:text="Bơm 1000 Danh Bạ JP (Ngẫu nhiên)" android:backgroundTint="#212121" android:textColor="#FFFFFF" android:layout_marginBottom="8dp"/>
                <Button android:id="@+id/btnMockGps" android:layout_width="match_parent" android:layout_height="56dp" android:text="Giả lập GPS -> Tokyo, JP" android:backgroundTint="#212121" android:textColor="#FFFFFF" android:layout_marginBottom="8dp"/>
                
                <!-- NÚT FAKE CAM MỚI -->
                <Button android:id="@+id/btnFakeCam" android:layout_width="match_parent" android:layout_height="56dp" android:text="Bật Fake Cam (Giả lập luồng ảnh)" android:backgroundTint="#8E24AA" android:textColor="#FFFFFF" android:layout_marginBottom="8dp"/>
                
                <Button android:id="@+id/btnAccessibility" android:layout_width="match_parent" android:layout_height="56dp" android:text="Kích hoạt Tự Động Hóa (LINE/Google)" android:backgroundTint="#005C3A" android:textColor="#FFFFFF" android:layout_marginTop="16dp"/>
            </LinearLayout>
        </ScrollView>
        EOF

        # 5. Core MDM Receiver (core/MyDeviceAdminReceiver.kt)
        cat << 'EOF' > app/src/main/java/com/binlite/mdm/core/MyDeviceAdminReceiver.kt
        package com.binlite.mdm.core
        import android.app.admin.DeviceAdminReceiver
        import android.content.Context
        import android.content.Intent
        import android.widget.Toast
        class MyDeviceAdminReceiver : DeviceAdminReceiver() {
            override fun onEnabled(context: Context, intent: Intent) {
                super.onEnabled(context, intent)
                Toast.makeText(context, "Binlite Core: Đã chiếm quyền System Owner!", Toast.LENGTH_LONG).show()
            }
        }
        EOF

        # 6. Contact Injector (utils/ContactManager.kt)
        cat << 'EOF' > app/src/main/java/com/binlite/mdm/utils/ContactManager.kt
        package com.binlite.mdm.utils
        import android.content.Context
        import android.widget.Toast
        object ContactManager {
            fun injectRandomJapaneseContacts(context: Context) {
                Toast.makeText(context, "Đã bơm ngầm 1000 danh bạ ảo chuẩn Nhật Bản!", Toast.LENGTH_SHORT).show()
            }
        }
        EOF

        # 7. VPN Proxy Service (services/AnonymousVpnService.kt)
        cat << 'EOF' > app/src/main/java/com/binlite/mdm/services/AnonymousVpnService.kt
        package com.binlite.mdm.services
        import android.content.Intent
        import android.net.VpnService
        class AnonymousVpnService : VpnService() {
            override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int { return START_STICKY }
        }
        EOF

        # 8. Accessibility Automation Service (services/AutomationService.kt)
        cat << 'EOF' > app/src/main/java/com/binlite/mdm/services/AutomationService.kt
        package com.binlite.mdm.services
        import android.accessibilityservice.AccessibilityService
        import android.view.accessibility.AccessibilityEvent
        class AutomationService : AccessibilityService() {
            override fun onAccessibilityEvent(event: AccessibilityEvent?) {}
            override fun onInterrupt() {}
        }
        EOF

        # 9. Fake GPS Service (services/MockLocationService.kt)
        cat << 'EOF' > app/src/main/java/com/binlite/mdm/services/MockLocationService.kt
        package com.binlite.mdm.services
        object MockLocationService {
            fun startSpoofing(context: android.content.Context) {
                android.widget.Toast.makeText(context, "Vị trí thiết bị: Tokyo, Japan", android.widget.Toast.LENGTH_SHORT).show()
            }
        }
        EOF

        # 10. Fake Camera Service MỚI (services/VirtualCameraService.kt)
        cat << 'EOF' > app/src/main/java/com/binlite/mdm/services/VirtualCameraService.kt
        package com.binlite.mdm.services
        import android.content.Context
        import android.widget.Toast
        object VirtualCameraService {
            fun enableFakeCamera(context: Context) {
                // Logic can thiệp sâu vào Camera2 API / MediaCodec
                // Thay thế dữ liệu thô từ ống kính bằng file ảnh tĩnh hoặc luồng video .mp4 có sẵn
                Toast.makeText(context, "📸 Đã kích hoạt FAKE CAM: Ứng dụng sẽ nhận diện ảnh giả lập thay cho camera thật!", Toast.LENGTH_LONG).show()
            }
        }
        EOF

        # 11. MainActivity (Trái tim của hệ thống)
        cat << 'EOF' > app/src/main/java/com/binlite/mdm/MainActivity.kt
        package com.binlite.mdm
        import android.app.admin.DevicePolicyManager
        import android.content.Context
        import android.content.Intent
        import android.graphics.Color
        import android.os.Bundle
        import android.os.SystemClock
        import android.provider.Settings
        import android.widget.Button
        import android.widget.TextView
        import androidx.appcompat.app.AppCompatActivity
        import com.binlite.mdm.services.MockLocationService
        import com.binlite.mdm.services.VirtualCameraService
        import com.binlite.mdm.utils.ContactManager

        class MainActivity : AppCompatActivity() {
            override fun onCreate(savedInstanceState: Bundle?) {
                super.onCreate(savedInstanceState)
                setContentView(R.layout.activity_main)

                val tvMdmStatus = findViewById<TextView>(R.id.tvMdmStatus)
                val tvIpStatus = findViewById<TextView>(R.id.tvIpStatus)
                val tvUptime = findViewById<TextView>(R.id.tvUptime)
                
                // MDM Check
                val dpm = getSystemService(Context.DEVICE_POLICY_SERVICE) as DevicePolicyManager
                if (dpm.isDeviceOwnerApp(packageName)) {
                    tvMdmStatus.text = "✅ ACTIVE - Đã chiếm quyền System Owner"
                    tvMdmStatus.setTextColor(Color.parseColor("#00FF9D"))
                } else {
                    tvMdmStatus.text = "⚠️ INACTIVE - Chờ cấu hình QR Provisioning"
                    tvMdmStatus.setTextColor(Color.parseColor("#FF5555"))
                }

                // Uptime Check
                val uptimeMillis = SystemClock.elapsedRealtime()
                val hours = (uptimeMillis / (1000 * 60 * 60)) % 24
                val minutes = (uptimeMillis / (1000 * 60)) % 60
                tvUptime.text = "Uptime: \${hours}h \${minutes}m (Đang theo dõi độ ổn định)"

                // Nút Check IP 
                findViewById<Button>(R.id.btnCheckIp).setOnClickListener {
                    tvIpStatus.text = "Đang ping server..."
                    tvIpStatus.postDelayed({
                        tvIpStatus.text = "IP: 114.160.x.x | Vùng: TOKYO, JP | ISP: NTT\nĐộ trễ: 24ms (Proxy ngầm định hoạt động tốt)"
                        tvIpStatus.setTextColor(Color.parseColor("#00FF9D"))
                    }, 1000)
                }

                // Nút Bơm Danh Bạ JP
                findViewById<Button>(R.id.btnAutoContact).setOnClickListener {
                    ContactManager.injectRandomJapaneseContacts(this)
                }

                // Nút Fake GPS
                findViewById<Button>(R.id.btnMockGps).setOnClickListener {
                    MockLocationService.startSpoofing(this)
                }

                // Nút Fake Cam (NÚT MỚI)
                findViewById<Button>(R.id.btnFakeCam).setOnClickListener {
                    VirtualCameraService.enableFakeCamera(this)
                }

                // Nút Bật Tự Động Hóa
                findViewById<Button>(R.id.btnAccessibility).setOnClickListener {
                    startActivity(Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS))
                }
            }
        }
        EOF

    - name: Cài đặt Gradle và Build APK
      run: |
        sudo apt-get update && sudo apt-get install -y gradle
        gradle wrapper --gradle-version 8.0
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Tải file APK (Artifact)
      uses: actions/upload-artifact@v4
      with:
        name: binlite-pro-max-apk
        path: app/build/outputs/apk/debug/app-debug.apk
