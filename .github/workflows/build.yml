name: Build Binlite FULL EDITION

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v4

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.2'

    - name: KHỞI TẠO TOÀN BỘ MÃ NGUỒN BINLITE FULL APP
      run: |
        mkdir -p app/src/main/java/com/binlite/mdm/core
        mkdir -p app/src/main/java/com/binlite/mdm/services
        mkdir -p app/src/main/java/com/binlite/mdm/utils
        mkdir -p app/src/main/res/xml
        mkdir -p app/src/main/res/layout
        mkdir -p app/src/main/res/values

        cat << 'EOF' > settings.gradle
        pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
        dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
        rootProject.name = "BinliteMDM"
        include ':app'
        EOF

        cat << 'EOF' > build.gradle
        plugins { id 'com.android.application' version '8.1.4' apply false; id 'org.jetbrains.kotlin.android' version '1.9.10' apply false }
        EOF

        cat << 'EOF' > app/build.gradle
        plugins { id 'com.android.application'; id 'org.jetbrains.kotlin.android' }
        android {
            namespace 'com.binlite.mdm'
            compileSdk 34
            defaultConfig {
                applicationId "com.binlite.mdm"
                minSdk 26
                targetSdk 34
                versionCode 3
                versionName "3.0 Full Enterprise"
            }
            compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
            kotlinOptions { jvmTarget = '17' }
        }
        dependencies {
            implementation 'androidx.core:core-ktx:1.12.0'
            implementation 'androidx.appcompat:appcompat:1.6.1'
            implementation 'com.google.android.material:material:1.11.0'
            implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
        }
        EOF

        cat << 'EOF' > app/src/main/AndroidManifest.xml
        <?xml version="1.0" encoding="utf-8"?>
        <manifest xmlns:android="http://schemas.android.com/apk/res/android"
            xmlns:tools="http://schemas.android.com/tools">
            <uses-permission android:name="android.permission.INTERNET" />
            <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
            <uses-permission android:name="android.permission.READ_CONTACTS" />
            <uses-permission android:name="android.permission.WRITE_CONTACTS" />
            <uses-permission android:name="android.permission.ACCESS_MOCK_LOCATION" tools:ignore="MockLocation" />
            <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />
            <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />
            <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />
            <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />

            <application
                android:allowBackup="true"
                android:label="Binlite Enterprise"
                android:theme="@style/Theme.AppCompat.Light.NoActionBar">
                
                <activity android:name=".MainActivity" android:exported="true">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN" />
                        <category android:name="android.intent.category.LAUNCHER" />
                    </intent-filter>
                </activity>

                <receiver android:name=".core.MyDeviceAdminReceiver" android:permission="android.permission.BIND_DEVICE_ADMIN" android:exported="true">
                    <meta-data android:name="android.app.device_admin" android:resource="@xml/device_admin" />
                    <intent-filter>
                        <action android:name="android.app.action.DEVICE_ADMIN_ENABLED" />
                        <action android:name="android.app.action.PROFILE_PROVISIONING_COMPLETE" />
                    </intent-filter>
                </receiver>

                <service android:name=".services.AutomationService" android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE" android:exported="true">
                    <intent-filter><action android:name="android.accessibilityservice.AccessibilityService" /></intent-filter>
                    <meta-data android:name="android.accessibilityservice" android:resource="@xml/accessibility_config" />
                </service>

                <service android:name=".services.AnonymousVpnService" android:permission="android.permission.BIND_VPN_SERVICE" android:exported="false">
                    <intent-filter><action android:name="android.net.VpnService" /></intent-filter>
                </service>
            </application>
        </manifest>
        EOF

        cat << 'EOF' > app/src/main/res/xml/device_admin.xml
        <?xml version="1.0" encoding="utf-8"?>
        <device-admin xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-policies><force-lock /><limit-password /><wipe-data /></uses-policies>
        </device-admin>
        EOF

        cat << 'EOF' > app/src/main/res/xml/accessibility_config.xml
        <?xml version="1.0" encoding="utf-8"?>
        <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
            android:accessibilityEventTypes="typeWindowStateChanged|typeWindowContentChanged|typeViewClicked"
            android:accessibilityFeedbackType="feedbackGeneric"
            android:accessibilityFlags="flagDefault|flagRetrieveInteractiveWindows|flagIncludeNotImportantViews"
            android:canRetrieveWindowContent="true"
            android:canPerformGestures="true"
            android:description="@string/accessibility_desc" />
        EOF

        cat << 'EOF' > app/src/main/res/values/strings.xml
        <resources><string name="accessibility_desc">Binlite Automation Core</string></resources>
        EOF

        cat << 'EOF' > app/src/main/res/layout/activity_main.xml
        <?xml version="1.0" encoding="utf-8"?>
        <ScrollView xmlns:android="http://schemas.android.com/apk/res/android"
            android:layout_width="match_parent" android:layout_height="match_parent" android:background="#050505">
            <LinearLayout android:layout_width="match_parent" android:layout_height="wrap_content" android:orientation="vertical" android:padding="20dp">
                <TextView android:layout_width="match_parent" android:layout_height="wrap_content" android:text="BINLITE CONTROL PANEL" android:textColor="#00E676" android:textSize="24sp" android:textStyle="bold" android:gravity="center" android:layout_marginTop="10dp" />
                <TextView android:layout_width="match_parent" android:layout_height="wrap_content" android:text="System Built: FULL ENTERPRISE" android:textColor="#555555" android:textSize="12sp" android:gravity="center" android:layout_marginBottom="20dp" />
                <TextView android:id="@+id/tvMdm" android:layout_width="match_parent" android:layout_height="wrap_content" android:text="[MDM] Đang nạp..." android:textColor="#FFF" android:background="#111" android:padding="15dp" android:layout_marginBottom="10dp"/>
                <TextView android:id="@+id/tvNet" android:layout_width="match_parent" android:layout_height="wrap_content" android:text="[NET] Đang kiểm tra..." android:textColor="#FFF" android:background="#111" android:padding="15dp" android:layout_marginBottom="10dp"/>
                <Button android:id="@+id/btnVpn" android:layout_width="match_parent" android:layout_height="60dp" android:text="Khởi động VPN Tunneling (Core)" android:backgroundTint="#1A1A1A" android:textColor="#00E676" android:layout_marginTop="20dp"/>
                <Button android:id="@+id/btnGps" android:layout_width="match_parent" android:layout_height="60dp" android:text="Ghi đè GPS (Tokyo, Japan)" android:backgroundTint="#1A1A1A" android:textColor="#FFF" android:layout_marginTop="8dp"/>
                <Button android:id="@+id/btnContact" android:layout_width="match_parent" android:layout_height="60dp" android:text="Bơm Danh bạ Random (+81)" android:backgroundTint="#1A1A1A" android:textColor="#FFF" android:layout_marginTop="8dp"/>
                <Button android:id="@+id/btnAuto" android:layout_width="match_parent" android:layout_height="60dp" android:text="Bật Accessibility (Auto LINE/GG)" android:backgroundTint="#00E676" android:textColor="#000" android:textStyle="bold" android:layout_marginTop="20dp"/>
            </LinearLayout>
        </ScrollView>
        EOF

        cat << 'EOF' > app/src/main/java/com/binlite/mdm/core/MyDeviceAdminReceiver.kt
        package com.binlite.mdm.core
        import android.app.admin.DeviceAdminReceiver
        import android.content.Context
        import android.content.Intent
        import android.widget.Toast
        class MyDeviceAdminReceiver : DeviceAdminReceiver() {
            override fun onEnabled(context: Context, intent: Intent) {
                super.onEnabled(context, intent)
                Toast.makeText(context, "Binlite FULL: Thiết bị đã bị kiểm soát!", Toast.LENGTH_LONG).show()
            }
        }
        EOF

        cat << 'EOF' > app/src/main/java/com/binlite/mdm/services/MockLocationService.kt
        package com.binlite.mdm.services
        import android.content.Context
        import android.location.Location
        import android.location.LocationManager
        import android.os.SystemClock
        import android.widget.Toast
        object MockLocationService {
            fun startSpoofing(context: Context) {
                try {
                    val lm = context.getSystemService(Context.LOCATION_SERVICE) as LocationManager
                    lm.addTestProvider(LocationManager.GPS_PROVIDER, false, false, false, false, true, true, true, 0, 5)
                    lm.setTestProviderEnabled(LocationManager.GPS_PROVIDER, true)
                    val loc = Location(LocationManager.GPS_PROVIDER)
                    loc.latitude = 35.6762
                    loc.longitude = 139.6503
                    loc.altitude = 10.0
                    loc.accuracy = 5.0f
                    loc.time = System.currentTimeMillis()
                    loc.elapsedRealtimeNanos = SystemClock.elapsedRealtimeNanos()
                    lm.setTestProviderLocation(LocationManager.GPS_PROVIDER, loc)
                    Toast.makeText(context, "Đã ghi đè GPS: TOKYO, JAPAN", Toast.LENGTH_SHORT).show()
                } catch (e: Exception) {
                    Toast.makeText(context, "Cần cấp quyền Mock Location", Toast.LENGTH_LONG).show()
                }
            }
        }
        EOF

        cat << 'EOF' > app/src/main/java/com/binlite/mdm/utils/ContactManager.kt
        package com.binlite.mdm.utils
        import android.content.ContentProviderOperation
        import android.content.Context
        import android.provider.ContactsContract
        import android.widget.Toast
        import kotlin.random.Random
        object ContactManager {
            fun injectJapaneseContacts(context: Context) {
                try {
                    val ops = ArrayList<ContentProviderOperation>()
                    val rawContactInsertIndex = ops.size
                    val p1 = Random.nextInt(1000, 9999)
                    val p2 = Random.nextInt(1000, 9999)
                    val phone = "+8190$p1$p2"
                    val name = "Sato JP $p1"
                    ops.add(ContentProviderOperation.newInsert(ContactsContract.RawContacts.CONTENT_URI)
                        .withValue(ContactsContract.RawContacts.ACCOUNT_TYPE, null)
                        .withValue(ContactsContract.RawContacts.ACCOUNT_NAME, null).build())
                    ops.add(ContentProviderOperation.newInsert(ContactsContract.Data.CONTENT_URI)
                        .withValueBackReference(ContactsContract.Data.RAW_CONTACT_ID, rawContactInsertIndex)
                        .withValue(ContactsContract.Data.MIMETYPE, ContactsContract.CommonDataKinds.StructuredName.CONTENT_ITEM_TYPE)
                        .withValue(ContactsContract.CommonDataKinds.StructuredName.DISPLAY_NAME, name).build())
                    ops.add(ContentProviderOperation.newInsert(ContactsContract.Data.CONTENT_URI)
                        .withValueBackReference(ContactsContract.Data.RAW_CONTACT_ID, rawContactInsertIndex)
                        .withValue(ContactsContract.Data.MIMETYPE, ContactsContract.CommonDataKinds.Phone.CONTENT_ITEM_TYPE)
                        .withValue(ContactsContract.CommonDataKinds.Phone.NUMBER, phone)
                        .withValue(ContactsContract.CommonDataKinds.Phone.TYPE, ContactsContract.CommonDataKinds.Phone.TYPE_MOBILE).build())
                    context.contentResolver.applyBatch(ContactsContract.AUTHORITY, ops)
                    Toast.makeText(context, "Đã bơm số: $phone", Toast.LENGTH_SHORT).show()
                } catch (e: Exception) {
                    Toast.makeText(context, "Lỗi DB hoặc thiếu quyền", Toast.LENGTH_SHORT).show()
                }
            }
        }
        EOF

        cat << 'EOF' > app/src/main/java/com/binlite/mdm/services/AutomationService.kt
        package com.binlite.mdm.services
        import android.accessibilityservice.AccessibilityService
        import android.view.accessibility.AccessibilityEvent
        import android.view.accessibility.AccessibilityNodeInfo
        import android.util.Log
        class AutomationService : AccessibilityService() {
            override fun onAccessibilityEvent(event: AccessibilityEvent?) {
                val rootNode = rootInActiveWindow ?: return
                findAndClickNode(rootNode, "Sign in")
                findAndClickNode(rootNode, "Đăng nhập")
                findAndClickNode(rootNode, "Next")
            }
            private fun findAndClickNode(node: AccessibilityNodeInfo, textToFind: String) {
                if (node.text != null && node.text.toString().contains(textToFind, ignoreCase = true)) {
                    if (node.isClickable) {
                        node.performAction(AccessibilityNodeInfo.ACTION_CLICK)
                    } else {
                        var parent = node.parent
                        while (parent != null) {
                            if (parent.isClickable) {
                                parent.performAction(AccessibilityNodeInfo.ACTION_CLICK)
                                break
                            }
                            parent = parent.parent
                        }
                    }
                }
                for (i in 0 until node.childCount) {
                    val child = node.getChild(i)
                    if (child != null) {
                        findAndClickNode(child, textToFind)
                        child.recycle()
                    }
                }
            }
            override fun onInterrupt() {}
        }
        EOF

        cat << 'EOF' > app/src/main/java/com/binlite/mdm/services/AnonymousVpnService.kt
        package com.binlite.mdm.services
        import android.content.Intent
        import android.net.VpnService
        import android.os.ParcelFileDescriptor
        class AnonymousVpnService : VpnService() {
            private var vpnInterface: ParcelFileDescriptor? = null
            override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
                setupVpn()
                return START_STICKY
            }
            private fun setupVpn() {
                try {
                    val builder = Builder()
                    builder.addAddress("10.0.0.2", 24)
                    builder.addRoute("0.0.0.0", 0)
                    builder.addDnsServer("8.8.8.8")
                    builder.setSession("BinliteTunnel")
                    builder.setBlocking(true)
                    vpnInterface = builder.establish()
                } catch (e: Exception) {
                    e.printStackTrace()
                }
            }
            override fun onDestroy() {
                vpnInterface?.close()
                super.onDestroy()
            }
        }
        EOF

        cat << 'EOF' > app/src/main/java/com/binlite/mdm/MainActivity.kt
        package com.binlite.mdm
        import android.app.admin.DevicePolicyManager
        import android.content.Context
        import android.content.Intent
        import android.graphics.Color
        import android.net.VpnService
        import android.os.Bundle
        import android.provider.Settings
        import android.widget.Button
        import android.widget.TextView
        import androidx.appcompat.app.AppCompatActivity
        import com.binlite.mdm.services.MockLocationService
        import com.binlite.mdm.services.AnonymousVpnService
        import com.binlite.mdm.utils.ContactManager

        class MainActivity : AppCompatActivity() {
            override fun onCreate(savedInstanceState: Bundle?) {
                super.onCreate(savedInstanceState)
                setContentView(R.layout.activity_main)
                val tvMdm = findViewById<TextView>(R.id.tvMdm)
                val tvNet = findViewById<TextView>(R.id.tvNet)
                val dpm = getSystemService(Context.DEVICE_POLICY_SERVICE) as DevicePolicyManager
                if (dpm.isDeviceOwnerApp(packageName)) {
                    tvMdm.text = "[MDM] ROOT OWNER: KÍCH HOẠT THÀNH CÔNG"
                    tvMdm.setTextColor(Color.parseColor("#00E676"))
                } else {
                    tvMdm.text = "[MDM] CẢNH BÁO: CHƯA CÓ QUYỀN SYSTEM"
                    tvMdm.setTextColor(Color.parseColor("#FF3D00"))
                }
                findViewById<Button>(R.id.btnVpn).setOnClickListener {
                    val vpnIntent = VpnService.prepare(this)
                    if (vpnIntent != null) startActivityForResult(vpnIntent, 0)
                    else {
                        startService(Intent(this, AnonymousVpnService::class.java))
                        tvNet.text = "[NET] STATUS: TUNNELING CHUẨN BỊ"
                        tvNet.setTextColor(Color.parseColor("#00E676"))
                    }
                }
                findViewById<Button>(R.id.btnGps).setOnClickListener { MockLocationService.startSpoofing(this) }
                findViewById<Button>(R.id.btnContact).setOnClickListener { ContactManager.injectJapaneseContacts(this) }
                findViewById<Button>(R.id.btnAuto).setOnClickListener { startActivity(Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS)) }
            }
        }
        EOF

    - name: Build APK bang Gradle
      run: gradle assembleDebug

    - name: Upload APK Full
      uses: actions/upload-artifact@v4
      with:
        name: binlite-full-enterprise
        path: '**/*.apk'
