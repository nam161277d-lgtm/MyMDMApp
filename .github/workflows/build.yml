name: Build Android APK Automatically

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Tự động tạo toàn bộ mã nguồn Android
      run: |
        mkdir -p app/src/main/java/com/example/myautomationmdm app/src/main/res/xml
        
        cat << 'EOF' > settings.gradle
        pluginManagement {
            repositories {
                google()
                mavenCentral()
                gradlePluginPortal()
            }
        }
        dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
            repositories {
                google()
                mavenCentral()
            }
        }
        rootProject.name = "MyMDMApp"
        include ':app'
        EOF

        cat << 'EOF' > build.gradle
        plugins {
            id 'com.android.application' version '8.1.0' apply false
            id 'org.jetbrains.kotlin.android' version '1.9.0' apply false
        }
        EOF

        cat << 'EOF' > app/build.gradle
        plugins {
            id 'com.android.application'
            id 'org.jetbrains.kotlin.android'
        }
        android {
            namespace 'com.example.myautomationmdm'
            compileSdk 34
            defaultConfig {
                applicationId "com.example.myautomationmdm"
                minSdk 24
                targetSdk 34
                versionCode 1
                versionName "1.0"
            }
            compileOptions {
                sourceCompatibility JavaVersion.VERSION_17
                targetCompatibility JavaVersion.VERSION_17
            }
            kotlinOptions {
                jvmTarget = '17'
            }
        }
        dependencies {
            implementation 'androidx.core:core-ktx:1.12.0'
            implementation 'androidx.appcompat:appcompat:1.6.1'
            implementation 'com.google.android.material:material:1.11.0'
        }
        EOF

        cat << 'EOF' > app/src/main/AndroidManifest.xml
        <?xml version="1.0" encoding="utf-8"?>
        <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <application
                android:allowBackup="true"
                android:label="MyMDMApp"
                android:theme="@style/Theme.AppCompat.Light.NoActionBar">
                <activity android:name=".MainActivity" android:exported="true">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN" />
                        <category android:name="android.intent.category.LAUNCHER" />
                    </intent-filter>
                </activity>
                <receiver
                    android:name=".MyDeviceAdminReceiver"
                    android:permission="android.permission.BIND_DEVICE_ADMIN"
                    android:exported="true">
                    <meta-data
                        android:name="android.app.device_admin"
                        android:resource="@xml/device_admin" />
                    <intent-filter>
                        <action android:name="android.app.action.DEVICE_ADMIN_ENABLED" />
                        <action android:name="android.app.action.PROFILE_PROVISIONING_COMPLETE" />
                    </intent-filter>
                </receiver>
            </application>
        </manifest>
        EOF

        cat << 'EOF' > app/src/main/res/xml/device_admin.xml
        <?xml version="1.0" encoding="utf-8"?>
        <device-admin xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-policies>
                <force-lock />
                <limit-password />
                <wipe-data />
            </uses-policies>
        </device-admin>
        EOF

        cat << 'EOF' > app/src/main/java/com/example/myautomationmdm/MyDeviceAdminReceiver.kt
        package com.example.myautomationmdm
        import android.app.admin.DeviceAdminReceiver
        import android.content.Context
        import android.content.Intent
        import android.widget.Toast
        class MyDeviceAdminReceiver : DeviceAdminReceiver() {
            override fun onEnabled(context: Context, intent: Intent) {
                super.onEnabled(context, intent)
                Toast.makeText(context, "Đã kích hoạt Device Owner!", Toast.LENGTH_LONG).show()
            }
        }
        EOF

        cat << 'EOF' > app/src/main/java/com/example/myautomationmdm/MainActivity.kt
        package com.example.myautomationmdm
        import android.os.Bundle
        import androidx.appcompat.app.AppCompatActivity
        class MainActivity : AppCompatActivity() {
            override fun onCreate(savedInstanceState: Bundle?) {
                super.onCreate(savedInstanceState)
                setContentView(android.widget.TextView(this).apply {
                    text = "MDM Automation App Ready!"
                })
            }
        }
        EOF

    - name: Cài đặt Gradle và Build APK
      run: |
        sudo apt-get update && sudo apt-get install -y gradle
        gradle wrapper --gradle-version 8.0
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Tải file APK (Artifact)
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/app-debug.apk
